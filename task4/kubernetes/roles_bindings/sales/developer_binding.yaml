  kind: Role
  name: app-debugger
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sales-developers-secrets
  namespace: sales
subjects:
- kind: Group
  name: sales-developers
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: secrets-viewer
  apiGroup: rbac.authorization.k8s.io