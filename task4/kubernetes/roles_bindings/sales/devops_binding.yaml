apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sales-devops
  namespace: sales
subjects:
- kind: Group
  name: sales-devops
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: namespace-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sales-devops-apps
  namespace: sales
subjects:
- kind: Group
  name: sales-devops
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: app-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sales-devops-secrets
  namespace: sales
subjects:
- kind: Group
  name: sales-devops
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: secrets-viewer
  apiGroup: rbac.authorization.k8s.io