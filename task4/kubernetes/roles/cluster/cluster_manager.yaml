apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-manager
rules:
# Управление узлами
- apiGroups: [""]
  resources:
    - "nodes"
    - "nodes/proxy"
  verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "update", "watch"]

# Управление namespace
- apiGroups: [""]
  resources:
    - "namespaces"
  verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "update", "watch"]

# Управление persistent volumes
- apiGroups: [""]
  resources:
    - "persistentvolumes"
  verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "update", "watch"]

# Управление storage
- apiGroups: ["storage.k8s.io"]
  resources:
    - "storageclasses"
    - "volumeattachments"
    - "csinodes"
    - "csidrivers"
  verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "update", "watch"]

# Только просмотр секретов (без изменения)
- apiGroups: [""]
  resources:
    - "secrets"
  verbs: ["get", "list", "watch"]
