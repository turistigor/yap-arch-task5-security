apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-analyst
rules:
# Метрики узлов
- apiGroups: [""]
  resources:
    - "nodes"
    - "nodes/metrics"
    - "nodes/stats"
  verbs: ["get", "list", "watch"]

# События кластера
- apiGroups: [""]
  resources:
    - "events"
  verbs: ["get", "list", "watch"]

# Поды и логи
- apiGroups: [""]
  resources:
    - "pods"
    - "pods/log"
  verbs: ["get", "list", "watch"]

# Информация о кластере
- apiGroups: [""]
  resources:
    - "namespaces"
    - "persistentvolumes"
    - "componentstatuses"
  verbs: ["get", "list", "watch"]

# Метрики API
- apiGroups: ["metrics.k8s.io"]
  resources:
    - "pods"
    - "nodes"
  verbs: ["get", "list", "watch"]

# Non-resource URLs для мониторинга
- nonResourceURLs:
    - "/metrics"
    - "/healthz"
    - "/readyz"
    - "/livez"
    - "/version"
  verbs: ["get"]