apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-viewer
  namespace: landlords
rules:
# Просмотр всех ресурсов в namespace
- apiGroups: [""]
  resources:
    - "pods"
    - "pods/log"
    - "services"
    - "configmaps"
    - "endpoints"
    - "persistentvolumeclaims"
    - "replicationcontrollers"
  verbs: ["get", "list", "watch"]

# Просмотр ресурсов apps
- apiGroups: ["apps"]
  resources:
    - "deployments"
    - "statefulsets"
    - "replicasets"
    - "daemonsets"
  verbs: ["get", "list", "watch"]

- apiGroups: ["batch"]
  resources:
    - "jobs"
    - "cronjobs"
  verbs: ["get", "list", "watch"]

- apiGroups: ["autoscaling"]
  resources:
    - "horizontalpodautoscalers"
  verbs: ["get", "list", "watch"]

- apiGroups: ["networking.k8s.io"]
  resources:
    - "ingresses"
    - "networkpolicies"
  verbs: ["get", "list", "watch"]
